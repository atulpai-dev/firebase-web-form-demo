<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A minimal Firebase email and password authentication demo.">
    <title>Firebase Auth Demo</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <main class="container">
        <section class="card" aria-labelledby="form-title">
            <h1 id="form-title">Create account</h1>
            <p class="intro">Sign up or log in with your email address.</p>

            <form id="auth-form">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="new-password" required>

                <button id="submit-button" type="submit">Create account</button>
            </form>

            <p class="switch-mode">
                <span id="mode-prompt">Already have an account?</span>
                <button class="link-button" id="mode-toggle" type="button">Log in</button>
            </p>

            <p id="status-message" class="status" role="status" aria-live="polite"></p>

            <section id="signed-in-panel" class="signed-in-panel" hidden>
                <p>Signed in as <strong id="user-email"></strong></p>
                <button id="sign-out-button" type="button">Sign out</button>
            </section>
        </section>
    </main>
    <script type="module" src="assets/js/form.js"></script>
</body>
</html>
